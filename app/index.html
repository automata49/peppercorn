  <title>Folio xx</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('folio-theme');
        const mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'light';
        const root = document.documentElement;
        if (mode === 'light' || mode === 'dark') root.dataset.theme = mode;
        root.dataset.themeMode = mode;
        const resolved = mode === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        root.style.colorScheme = resolved;
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', resolved === 'dark' ? '#0a0a0c' : '#f4f1ec');
      } catch {}
    })();
  </script>
</head>
<body>
  <div id="root" style="min-height:100dvh;background:var(--folio-paper,#f4f1ec)"></div>
  <script type="module" src="../src/main.tsx"></script>
</body>
