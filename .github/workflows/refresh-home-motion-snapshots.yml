name: Rebaseline approved home motion
on:
  push:
    branches: [fix/rebaseline-home-motion-20261017]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Verify optical splash and reversible home motion
        run: npx playwright test tests/launch-home-motion.spec.ts
      - name: Update desktop home visual baselines
        env:
          CI: ''
        run: npx playwright test tests/four-screen-visual.spec.ts -g "desktop-1440" --update-snapshots
      - name: Commit reviewed home visual references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/four-screen-visual.spec.ts-snapshots
          if ! git diff --cached --quiet; then
            git commit -m "test: update approved home motion screenshots [skip ci]"
            git push origin HEAD:fix/rebaseline-home-motion-20261017
          fi
