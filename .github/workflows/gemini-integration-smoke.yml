name: Gemini integration smoke
on:
  push:
    branches: [codex/gemini-integration-smoke]
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check configured Gemini without publishing test content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import analysis.leader_insights as adapter
          adapter.MODEL = 'gemini-3.5-flash-lite'
          from analysis.leader_insights import summarize
          key = os.environ.get('GEMINI_API_KEY', '')
          if not key:
              print('PROVIDER_RESULT=not_configured')
          else:
              article = {'id':'integration-smoke', 'title':'연동 검증 자료', 'text':'이 문장은 Folio의 Gemini API 연결을 확인하기 위한 테스트 자료입니다. 실제 기업 뉴스나 투자 판단을 포함하지 않습니다.'}
              try:
                  summarize(article, key)
                  print('PROVIDER_RESULT=validated_draft')
              except Exception as error:
                  allowed = {'invalid draft schema','ungrounded draft','draft size','generated link or HTML','unsupported numeric token','investment instruction','oversized model response'}
                  reason = str(error) if type(error) is ValueError and str(error) in allowed else type(error).__name__
                  print('PROVIDER_RESULT=failed; HTTP_STATUS=' + str(getattr(error, 'code', None)) + '; VALIDATION=' + reason)
          import json
          import analysis.premium_insights as premium
          premium.HOSTS.clear()
          premium.HOSTS.add('contents.premium.naver.com')
          result = premium.collect(premium.PublicHTTP(), premium.dt.datetime.now(premium.UTC), key)
          print('PUBLIC_PREVIEW_RESULT=' + json.dumps(result, ensure_ascii=False))
          PY
