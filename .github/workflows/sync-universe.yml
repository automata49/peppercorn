name: Sync investment universe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analysis/sync_universe.py'
      - 'analysis/fetch_prices.py'
      - 'analysis/analyze.py'
      - 'analysis/requirements.txt'
      - '.github/workflows/sync-universe.yml'
  schedule:
    - cron: '35 20 * * 0'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r analysis/requirements.txt
      - name: Sync index and market universe
        run: python analysis/sync_universe.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PEPPERCORN_TARGET_EQUITIES: '1500'
      - name: Validate universe and classifications
        run: python analysis/validate_universe.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Bootstrap or refresh prices
        run: python analysis/fetch_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PEPPERCORN_PRICE_WORKERS: '8'
      - name: Recalculate leadership metrics
        run: python analysis/analyze.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
