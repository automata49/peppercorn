name: Sync investment universe

on:
  workflow_dispatch:
    inputs:
      universe_version:
        description: '1 = 지수 구성 + NASDAQ 시총 채움(기존), 2 = UNIVERSE-2 투자 가능 종목 기준. 비우면 저장소 변수 UNIVERSE_VERSION(없으면 1)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'analysis/sync_universe.py'
      - 'analysis/kr_classification.py'
      - 'analysis/validate_universe.py'
      - 'analysis/requirements.txt'
      - 'supabase/functions/universe-import/**'
      - 'supabase/functions/refresh-market/**'
      - 'supabase/functions/recalculate-market/**'
      - '.github/workflows/sync-universe.yml'
  schedule:
    - cron: '35 20 * * 0'

permissions:
  contents: read
  id-token: write

env:
  FUNCTIONS_URL: https://mhbcchegrbakearqptdr.supabase.co/functions/v1
  OIDC_AUDIENCE: peppercorn-supabase

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r analysis/requirements.txt
      - name: Build universe payload
        run: python analysis/sync_universe.py
        env:
          PEPPERCORN_TARGET_EQUITIES: '1500'
          PEPPERCORN_UNIVERSE_VERSION: ${{ inputs.universe_version || vars.UNIVERSE_VERSION || '1' }}
          UNIVERSE_OUTPUT: universe_payload.json
          UNIVERSE_DECISIONS_OUTPUT: universe_decisions.json
      - name: Keep the screening decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-decisions
          path: universe_decisions.json
          if-no-files-found: ignore
      - name: Validate constituents and classifications
        run: python analysis/validate_universe.py
        env:
          UNIVERSE_OUTPUT: universe_payload.json
      - name: Import universe with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          curl -fsS -X POST "$FUNCTIONS_URL/universe-import"             -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             --data-binary @universe_payload.json
      - name: Bootstrap market metrics in chunks
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          get_token() {
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          for OFFSET in $(seq 0 120 6000); do
            TOKEN=$(get_token); echo "::add-mask::$TOKEN"
            PAYLOAD=$(printf '{"offset":%s,"limit":120}' "$OFFSET")
            RESP=$(curl -fsS -X POST "$FUNCTIONS_URL/refresh-market" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$PAYLOAD")
            echo "$RESP"
            REQUESTED=$(printf '%s' "$RESP" | python -c 'import json,sys; print(json.load(sys.stdin).get("requested",0))')
            [ "$REQUESTED" -eq 0 ] && break
          done
      - name: Recalculate RS and leadership
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          curl -sS --fail-with-body -X POST "$FUNCTIONS_URL/recalculate-market" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}'
