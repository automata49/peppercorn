name: Folio report reader UI gate
on:
  pull_request:
    paths:
      - 'src/components/SourceReports.tsx'
      - 'src/components/ReportVisuals.tsx'
      - 'src/components/source-reports.css'
      - 'src/lib/reportPresentation.ts'
      - 'tests/source-reports.spec.ts'
      - 'tests/report-presentation.spec.ts'
      - '.github/workflows/report-reader-ui-gate.yml'
permissions:
  contents: read
concurrency:
  group: folio-report-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npx playwright test tests/source-reports.spec.ts tests/report-presentation.spec.ts --workers=2 --max-failures=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: report-reader-evidence
          path: test-results/
