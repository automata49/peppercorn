name: Leadership v2 backtest (read-only)

# LEADERSHIP-V2. 읽기 전용: 사전등록한 v2 후보 규칙(analysis/leadership_v2.py)을 현재 v1 분류와 과거 월말 시점마다 비교한다.
# 공개 leaderboard(유니버스·업종), Yahoo 5년 일봉, SEC frames, OpenDART만 읽고 Supabase 에는 쓰지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet 'requests==2.32.5' 'yfinance==0.2.65' 'pandas==2.3.2' 'numpy==2.3.3'
      - name: Backtest
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python analysis/leadership_backtest.py && cat leadership_backtest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leadership-backtest
          path: |
            leadership_backtest.md
            leadership_backtest.json
          if-no-files-found: ignore
