name: Folio Visual Baseline Refresh (temporary)
on:
  push:
    branches: [feat/folio-daily-portraits-largecap-20261018]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'automata49/peppercorn'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      # A maintenance-only baseline update. Normal Pepper harness never updates snapshots.
      - name: Regenerate approved responsive snapshots
        run: env -u CI npx playwright test tests/four-screen-visual.spec.ts --update-snapshots=all
      - name: Commit refreshed reference screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/four-screen-visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo 'No visual changes'
          else
            git commit -m 'test(visual): refresh approved Folio Today design baseline'
            git push origin HEAD:refs/heads/feat/folio-daily-portraits-largecap-20261018
          fi
