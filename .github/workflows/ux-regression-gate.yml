name: Folio UX regression alignment
on:
  pull_request:
    paths:
      - 'tests/**'
      - 'src/components/FilterWheel.tsx'
      - 'src/design/discovery-catalog.css'
      - '.github/workflows/ux-regression-gate.yml'
permissions:
  contents: read
concurrency:
  group: folio-ux-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Verify updated browsing, charts, search and navigation tests
        run: npx playwright test tests/discovery-navigation-rotary.spec.ts tests/analysis.spec.ts tests/workbench.spec.ts tests/stock-trends.spec.ts tests/source-reports.spec.ts tests/snapshot.spec.ts tests/market-surfaces.spec.ts tests/motion-dismiss.spec.ts tests/nav-icons.spec.ts tests/obra-reference.spec.ts tests/journey.spec.ts tests/production-modules.spec.ts tests/live-quotes.spec.ts tests/mobile-information-hierarchy.spec.ts tests/mobile-flat-surfaces.spec.ts tests/rs-chart.spec.ts tests/dashboard.spec.ts --workers=2 --max-failures=16
