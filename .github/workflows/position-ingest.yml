name: Position ingest

# 라벨 없는 재무 사실과 스냅샷을 position-ingest Edge Function 을 통해 적재한다 (GitHub OIDC, 비밀키 없음).
# 함수는 main 브랜치의 이 워크플로 토큰만 받는다. 매주 월요일 운영에 적재하고, 수동 실행으로 테스트 프로젝트를 고를 수 있다.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 적재 대상
        type: choice
        options: [test, prod]
        default: test

permissions:
  contents: read
  id-token: write

concurrency:
  group: position-ingest
  cancel-in-progress: false

env:
  PROD_FUNCTIONS_URL: https://mhbcchegrbakearqptdr.supabase.co/functions/v1
  OIDC_AUDIENCE: peppercorn-supabase

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: analysis/fundamentals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'requests==2.32.5' 'pytest==8.4.2'
      - run: python -m pytest -q

      - name: Collect (SEC + DART)
        shell: bash
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TARGET: ${{ inputs.target || 'prod' }}
        # Production follows the dashboard's public leaders; the test project lists only the two reference companies.
        # A failed quality check still produces a result; persist turns it into a check_failed snapshot.
        run: |
          if [ "$TARGET" = "prod" ]; then
            python targets.py --out targets.json
            python collect.py --out out --targets targets.json || echo "::warning::collector reported failed checks"
          else
            python collect.py --out out || echo "::warning::collector reported failed checks"
          fi

      - name: Dry run
        run: python persist.py out --tolerate-refusals

      - name: Ingest through the Edge Function (twice; the second must add nothing)
        shell: bash
        env:
          TARGET: ${{ inputs.target || 'prod' }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "prod" ]; then
            base="$PROD_FUNCTIONS_URL"
          else
            project="${TEST_SUPABASE_URL%/}"; project="${project%/rest/v1}"
            base="$project/functions/v1"
          fi
          export POSITION_EDGE_URL="$base/position-ingest" POSITION_OIDC_AUDIENCE="$OIDC_AUDIENCE"
          for round in first second; do
            # persist.py requests a fresh OIDC token for every company; tokens are short-lived.
            echo "== $round round ($TARGET)"
            python persist.py out --apply --via edge --tolerate-refusals | tee "ingest-$round.txt"
          done
          if grep -Eq "'facts_inserted': [1-9]|'snapshots_inserted': [1-9]" ingest-second.txt; then
            echo "::error::second round inserted rows; ingestion is not idempotent"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: position-ingest
          path: |
            analysis/fundamentals/out/
            analysis/fundamentals/targets.json
          if-no-files-found: warn
