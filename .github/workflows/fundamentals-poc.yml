name: Fundamentals PoC (NVDA + Samsung)

# 수동 실행 전용. Actions 탭 → "Fundamentals PoC" → Run workflow
on:
  workflow_dispatch:
    inputs:
      market:
        description: 수집 대상
        type: choice
        options: [ALL, US, KR]
        default: ALL
      scope:
        description: 대상 (reference 기준 2종목, leaders 대시보드 주도 종목 전체 — DB 쓰기 없음)
        type: choice
        options: [reference, leaders]
        default: reference

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: analysis/fundamentals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet 'requests==2.32.5' 'pytest==8.4.2'
      - name: Offline tests
        run: python -m pytest -q
      - name: Collect and verify
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MARKET: ${{ inputs.market }}
          SCOPE: ${{ inputs.scope }}
        run: |
          args="--out out"
          [ "$MARKET" = "ALL" ] || args="$args --only $MARKET"
          if [ "$SCOPE" = "leaders" ]; then
            python targets.py --out targets.json
            python collect.py $args --targets targets.json || echo "::warning::some targets failed checks"
            python persist.py out --tolerate-refusals | tail -40
          else
            python collect.py $args
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-poc
          path: analysis/fundamentals/out/
          if-no-files-found: warn
