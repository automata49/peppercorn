name: Fundamentals PoC (NVDA + Samsung)

# 수동 실행 전용. Actions 탭 → "Fundamentals PoC" → Run workflow
on:
  workflow_dispatch:
    inputs:
      market:
        description: 수집 대상
        type: choice
        options: [ALL, US, KR]
        default: ALL

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis/fundamentals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet 'requests==2.32.5' 'pytest==8.4.2'
      - name: Offline tests
        run: python -m pytest -q
      - name: Collect and verify
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MARKET: ${{ inputs.market }}
        run: |
          if [ "$MARKET" = "ALL" ]; then python collect.py --out out; else python collect.py --out out --only "$MARKET"; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-poc
          path: analysis/fundamentals/out/
          if-no-files-found: warn
