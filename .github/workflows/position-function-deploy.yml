name: Edge function deploy

# 수동 실행 전용. Position Edge Function(position-ingest, position-public) 또는 quotes 를 테스트 또는 운영 프로젝트에 배포한다.
# Supabase 개인 액세스 토큰: 운영은 SUPABASE_ACCESS_TOKEN, 테스트는 SUPABASE_ACCESS_TOKEN_TEST (없으면 운영 토큰을 시도).
# 토큰은 각 프로젝트 하나에 Edge Functions 권한만 주는 것을 권장한다. 운영은 confirm 에 deploy 를 입력해야 한다.
on:
  workflow_dispatch:
    inputs:
      function:
        description: 배포할 함수
        type: choice
        options: [position-ingest, position-public, quotes]
        default: position-ingest
      target:
        description: 배포 대상
        type: choice
        options: [test, prod]
        default: test
      confirm:
        description: 운영 배포 시 deploy 입력
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        shell: bash
        env:
          PROD_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEST_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_TEST }}
          TARGET: ${{ inputs.target }}
          FUNCTION: ${{ inputs.function }}
          CONFIRM: ${{ inputs.confirm }}
          FUNCTION: ${{ inputs.function }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "prod" ]; then export SUPABASE_ACCESS_TOKEN="$PROD_TOKEN"; else export SUPABASE_ACCESS_TOKEN="${TEST_TOKEN:-$PROD_TOKEN}"; fi
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::no Supabase access token secret for $TARGET"; exit 1; }
          if [ "$TARGET" = "prod" ]; then
            [ "$CONFIRM" = "deploy" ] || { echo "::error::production deploy needs confirm=deploy"; exit 1; }
            ref=mhbcchegrbakearqptdr
          else
            ref=$(printf '%s' "$TEST_SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')
            [ "$ref" != "mhbcchegrbakearqptdr" ] || { echo "::error::test target resolves to production"; exit 1; }
          fi
          # position-ingest authenticates with a GitHub OIDC token; position-public and quotes are public read-only
          # endpoints guarded by origin and client token like leaderboard. None uses a Supabase JWT.
          case "$FUNCTION" in position-ingest|position-public|quotes) ;; *) echo "::error::unknown function $FUNCTION"; exit 1;; esac
          supabase functions deploy "$FUNCTION" --project-ref "$ref" --no-verify-jwt
