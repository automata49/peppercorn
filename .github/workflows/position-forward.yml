name: Position walk-forward

# 매월 자동 실행. 라벨 규칙 후보의 예측을 봉인하고, 3년 결과가 성숙한 시점으로만 채점하며, 새 후보를 제안한다.
# 모델(LLM) 호출 없음. 결과는 main 이 아닌 position-ledger 브랜치에 커밋한다. 라벨 활성화는 사람의 결정이다.
on:
  schedule:
    - cron: '0 7 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: position-forward
  cancel-in-progress: false

env:
  # Runs from any branch other than main write to a separate test ledger.
  LEDGER_BRANCH: ${{ github.ref == 'refs/heads/main' && 'position-ledger' || 'position-ledger-test' }}

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'requests==2.32.5' 'pytest==8.4.2'
      - run: python -m pytest -q analysis/fundamentals

      - name: Ledger worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$LEDGER_BRANCH" >/dev/null; then
            git fetch origin "$LEDGER_BRANCH"
            git worktree add ledger "origin/$LEDGER_BRANCH" -B "$LEDGER_BRANCH"
          else
            git worktree add --orphan -b "$LEDGER_BRANCH" ledger
          fi

      - name: Fetch SEC facts and prices
        working-directory: analysis/fundamentals
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python backtest.py fetch --cache cache --universe ALL

      - name: Walk-forward step
        working-directory: analysis/fundamentals
        run: |
          python forward.py step --cache cache --ledger "$GITHUB_WORKSPACE/ledger" | tee -a "$GITHUB_STEP_SUMMARY"
          cp cache/manifest.json "$GITHUB_WORKSPACE/ledger/last_fetch_manifest.json"

      - name: Commit ledger
        working-directory: ledger
        run: |
          git add -A
          if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
          git commit -q -m "walk-forward step $(date -u +%F) from ${GITHUB_SHA::7}"
          git push -q origin "HEAD:$LEDGER_BRANCH"

      - name: Ask for review when a candidate is ready
        if: hashFiles('ledger/READY_FOR_REVIEW') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Position rule candidate ready for review"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "Candidates: $(tr '\n' ' ' < ledger/READY_FOR_REVIEW). See ledger/STATUS.md on the $LEDGER_BRANCH branch. Activation is a human decision (docs/harness/POSITION_RULES_V1.md)."
          fi
