name: Folio discovery UI gate
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/FilterWheel.tsx'
      - 'src/components/DiscoveryNews.tsx'
      - 'src/components/StockTrendList.tsx'
      - 'src/design/discovery-catalog.css'
      - 'tests/discovery-*.spec.ts'
      - '.github/workflows/discovery-ui-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Check discovery Cover Flow, search popup, news and detailed navigation
        run: npx playwright test tests/discovery-navigation-rotary.spec.ts tests/discovery-news.spec.ts tests/discovery-coverflow-colors.spec.ts tests/discovery-catalog.spec.ts
