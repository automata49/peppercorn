name: Leaderboard probe (temporary)
on:
  push:
    branches: [claude/leaderboard-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save the public leaderboard response to the probe branch
        run: |
          curl -sS -o probe-leaderboard.json -H 'Origin: https://automata49.github.io' 'https://mhbcchegrbakearqptdr.supabase.co/functions/v1/leaderboard?client=peppercorn-public-read-v1'
          ls -l probe-leaderboard.json
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-leaderboard.json && git commit -m "probe data [skip ci]" && git push
