name: Refresh market analysis

on:
  pull_request:
    paths: ["scripts/refresh-market-direct*", "scripts/market-db.mjs", "analysis/market_sessions.py", "supabase/functions/_shared/market-metrics.ts", ".github/workflows/analyze.yml"]
  push:
    branches: [main]
    paths: ["scripts/refresh-market-direct.mjs", "scripts/market-db.mjs", "analysis/market_sessions.py", "supabase/functions/_shared/market-metrics.ts", ".github/workflows/analyze.yml"]
  workflow_dispatch:
    inputs:
      market:
        description: Market to refresh manually
        type: choice
        options: [ALL, KR, US]
        default: ALL
  schedule:
    # Keep the 20-hour CDN publication gate valid across weekends and exchange holidays.
    - cron: '0 8,20 * * *'
    # One hour before/after regular sessions; 14:00 ET covers NYSE early closes.
    - cron: '0 8 * * 1-5'
      timezone: Asia/Seoul
    - cron: '30 16 * * 1-5'
      timezone: Asia/Seoul
    - cron: '30 8 * * 1-5'
      timezone: America/New_York
    - cron: '0 14 * * 1-5'
      timezone: America/New_York
    - cron: '0 17 * * 1-5'
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: folio-market-refresh
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test scripts/refresh-market-direct.test.mjs
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select market and verify the exchange session
        id: route
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MARKET: ${{ inputs.market }}
        run: |
          set -euo pipefail
          if [ -z "$SCHEDULE" ]; then
            echo "market=${MANUAL_MARKET:-ALL}" >> "$GITHUB_OUTPUT"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SCHEDULE" = '0 8,20 * * *' ]; then
            echo 'market=ALL' >> "$GITHUB_OUTPUT"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'export_only=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            '0 8 * * 1-5'|'30 16 * * 1-5') MARKET=KR; TIMEZONE=Asia/Seoul ;;
            '30 8 * * 1-5'|'0 14 * * 1-5'|'0 17 * * 1-5') MARKET=US; TIMEZONE=America/New_York ;;
            *) echo "Unexpected schedule: $SCHEDULE" >&2; exit 1 ;;
          esac
          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
          export MARKET TIMEZONE
          python -m pip install --quiet 'exchange_calendars==4.13.2'
          python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          import exchange_calendars as xcals

          market = os.environ['MARKET']
          zone = ZoneInfo(os.environ['TIMEZONE'])
          today = dt.datetime.now(zone).date()
          calendar = xcals.get_calendar('XKRX' if market == 'KR' else 'XNYS')
          slot = os.environ['SCHEDULE'].split()
          minute, hour = int(slot[0]), int(slot[1])
          allowed = False
          if calendar.is_session(str(today)):
              opened, closed = calendar.session_open_close(str(today))
              for target in (opened - dt.timedelta(hours=1), closed + dt.timedelta(hours=1)):
                  local = target.to_pydatetime().astimezone(zone)
                  if (local.hour, local.minute) == (hour, minute):
                      allowed = True
                      break
              # GitHub can start a scheduled run hours late. A pre-open run that lands inside the session would store
              # an intraday bar as the day's close, so it waits for the post-close slot instead.
              now = dt.datetime.now(dt.timezone.utc)
              if allowed and opened.to_pydatetime() <= now < closed.to_pydatetime():
                  allowed = False
                  print(f'{market} {today}: skip (run started during the session at {now.astimezone(zone):%H:%M})')
          print(f'{market} {today}: {"refresh" if allowed else "skip (holiday, different session hours or delayed into the session)"}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run={str(allowed).lower()}\n')
          PY
      - name: Install runner dependencies
        if: steps.route.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts
          python -m pip install --quiet 'exchange_calendars==4.13.2'
      - name: Resolve latest completed exchange sessions
        if: steps.route.outputs.run == 'true'
        env:
          TARGET_MARKET: ${{ steps.route.outputs.market }}
        run: |
          CLOSED_SESSIONS=$(python -m analysis.market_sessions --market "$TARGET_MARKET")
          echo "CLOSED_SESSIONS=$CLOSED_SESSIONS" >> "$GITHUB_ENV"
      - name: Collect daily bars and recalculate through Postgres
        if: steps.route.outputs.run == 'true'
        env:
          PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
          EXPORT_ONLY: ${{ steps.route.outputs.export_only }}
        run: node scripts/refresh-market-direct.mjs
      - name: Save public refresh evidence
        if: steps.route.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-market-refresh
          path: market-output/
          retention-days: 7
