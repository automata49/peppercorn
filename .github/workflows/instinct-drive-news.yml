name: Instinct Drive leader news (public summaries only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: instinct-drive-leader-news
  cancel-in-progress: false
jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate public news ingestion
        run: python -m unittest analysis.test_sync_instinct_news analysis.test_news_visuals
      - name: Fetch configured Drive news files
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python analysis/sync_instinct_news.py
      - name: Generate cached visual assets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python analysis/news_visuals.py
      - name: Commit changed public news and assets
        id: publish
        run: |
          git add -A -- public/data/instinct-leader-news.json public/data/news-assets
          if git diff --cached --quiet -- public/data/instinct-leader-news.json public/data/news-assets; then
            echo "No new news or image assets"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh public Instinct leader news"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy updated news feed
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
