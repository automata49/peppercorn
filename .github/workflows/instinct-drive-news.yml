name: Instinct Drive leader news (public summaries only)
on:
  pull_request:
    paths:
      - 'analysis/instinct*'
      - 'analysis/sync_instinct*'
      - 'analysis/test_instinct*'
      - 'analysis/test_sync_instinct*'
      - 'analysis/news_visuals.py'
      - '.github/workflows/instinct-drive-news.yml'
  push:
    branches: [main]
    paths:
      - public/data/instinct-leader-news.json
      - analysis/news_visuals.py
      - analysis/sync_instinct_reports.py
      - analysis/sync_instinct_news.py
      - analysis/instinct_images.py
      - .github/workflows/instinct-drive-news.yml
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
concurrency:
  group: instinct-drive-leader-news-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow==12.0.0'
      - run: python -m unittest analysis.test_sync_instinct_news analysis.test_news_visuals analysis.test_instinct_images analysis.test_sync_instinct_reports
  publish-news:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image decoder
        run: python -m pip install 'Pillow==12.0.0'
      - name: Fetch configured Drive news files
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          if [ -n "$GOOGLE_DRIVE_CLIENT_ID" ] && [ -n "$GOOGLE_DRIVE_CLIENT_SECRET" ] && [ -n "$GOOGLE_DRIVE_REFRESH_TOKEN" ]; then
            python -m analysis.sync_instinct_news
          else
            echo "::warning::Google Drive OAuth is not configured. Using last approved committed news snapshot."
          fi
      - name: Generate cached visual assets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python analysis/news_visuals.py
      - name: Commit changed public news and assets
        id: publish
        run: |
          git add -A -- public/data/instinct-leader-news.json public/data/news-assets
          if git diff --cached --quiet -- public/data/instinct-leader-news.json public/data/news-assets; then
            echo "No new news or image assets"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh public Instinct leader news"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy updated news feed
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

  private-reports:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow==12.0.0'
      - name: Sync owner-only Instinct JSON reports
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FOLIO_REPORT_USER_ID: ${{ secrets.FOLIO_REPORT_USER_ID }}
        run: python -m analysis.sync_instinct_reports
