name: Stock flags dry run (temporary)
on:
  push:
    branches: [claude/flags-dart-budget]
    paths: [.github/workflows/stock-flags-dryrun.yml]
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python -m pip install --quiet 'requests==2.32.5' 'yfinance==0.2.65' 'pandas==2.3.2' 'numpy==2.3.3'
          time timeout 12m python analysis/stock_flags.py --out out/stock-flags.json
          ls -la out
          python -c "import json;d=json.load(open('out/stock-flags.json'));print(d['growth_period'],d['sources'])"
