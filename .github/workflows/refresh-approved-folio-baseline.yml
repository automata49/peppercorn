name: Refresh approved Folio visual baseline once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-approved-folio-baseline.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Recreate reviewed, deterministic 4-screen light and dark baselines
        run: env -u CI npx playwright test tests/four-screen-visual.spec.ts --update-snapshots=all
      - name: Commit approved snapshots and remove one-time updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-approved-folio-baseline.yml
          git add -A tests/four-screen-visual.spec.ts-snapshots .github/workflows/refresh-approved-folio-baseline.yml
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh approved Folio editorial visual snapshots [skip ci]"
            git push origin HEAD:main
          fi
