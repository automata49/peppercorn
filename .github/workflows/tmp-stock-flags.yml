name: TEMP stock flags dry run
on:
  push:
    branches: [claude/leadership-badges]
permissions:
  contents: read
jobs:
  flags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'requests==2.32.5' 'yfinance==0.2.65' 'pandas==2.3.2' 'numpy==2.3.3'
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          time python analysis/stock_flags.py --out out/stock-flags.json
          ls -la out
          python - <<'PY'
          import json
          d=json.load(open('out/stock-flags.json'))
          f=d['flags']
          for k in ['US:KOD','US:NVDA','US:MU','US:FORM','US:APA','US:AMTB','US:SB','US:RVMD','US:MRNA','KR:005930','KR:000660']:
              print(k, f.get(k))
          print('jump list:', sorted([k for k,v in f.items() if 'jump' in v]))
          print('no_revenue list:', sorted([k for k,v in f.items() if v.get('no_revenue')])[:80])
          PY
