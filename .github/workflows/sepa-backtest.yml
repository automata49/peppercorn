name: SEPA default backtest (read-only)

# SEPA-DEFAULT. 읽기 전용: SEPA-1을 배지가 아닌 기본 설정으로 쓸 때(analysis/sepa_backtest.py 사전등록 변형)를 v1과 과거 월말 시점마다 비교한다.
# 공개 leaderboard(유니버스·업종), Yahoo 5년 일봉, SEC frames, OpenDART만 읽고 Supabase 에는 쓰지 않는다.
on:
  workflow_dispatch:
  push:  # temporary: one run from this branch, removed before merge
    branches: [claude/leader-topdown-sepa]
    paths: [.github/workflows/sepa-backtest.yml]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet 'requests==2.32.5' 'yfinance==0.2.65' 'pandas==2.3.2' 'numpy==2.3.3'
      - name: Backtest
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python analysis/sepa_backtest.py && cat sepa_backtest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sepa-backtest
          path: |
            sepa_backtest.md
            sepa_backtest.json
          if-no-files-found: ignore
