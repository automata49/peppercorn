name: One-time Folio Today snapshot review candidate
on:
  push:
    branches:
      - folio/today-daily-quotes-and-news-large-cap-20261018
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run harness:check
      - run: npm run build
      - name: Render updated four-screen candidates in pinned Chromium/fonts
        env:
          CI: ''
        run: npx playwright test tests/four-screen-visual.spec.ts --update-snapshots=all
      - name: Verify candidates without auto acceptance
        run: npm run test:four-screens
      - name: Remove one-time workflow and stage updated image baselines
        run: |
          git diff --check
          rm .github/workflows/refresh-today-quote-snapshots-once.yml
          git add -A -- .github/workflows/refresh-today-quote-snapshots-once.yml tests/four-screen-visual.spec.ts-snapshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'test(visual): update Today viewport snapshots on pinned renderer'
            git push origin HEAD:folio/today-daily-quotes-and-news-large-cap-20261018
          fi
