name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Keep branch Pages source deployable
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/logo.webp logo.webp
          cp dist/apple-touch-icon.png apple-touch-icon.png
          cp dist/icon-192.png icon-192.png
          cp dist/icon-512.png icon-512.png
          cp dist/icon-512-maskable.png icon-512-maskable.png
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets manifest.webmanifest logo.webp apple-touch-icon.png icon-192.png icon-512.png icon-512-maskable.png .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync built Pages output [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
