name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:
  # LEADERBOARD-STATIC-1: republish (build + data/leaderboard.json, no tests) after each market refresh.
  workflow_run:
    workflows: ['Refresh market analysis']
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      || (github.event_name != 'workflow_run' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'requests==2.32.5' 'pytest==8.4.2' 'pandas==2.3.2' 'numpy==2.3.3'
      - if: github.event_name != 'workflow_run'
        run: python -m pytest -q analysis/fundamentals
      - if: github.event_name != 'workflow_run'
        run: python -m pytest -q analysis/tests
      - if: github.event_name != 'workflow_run'
        run: npm run harness:check
      - if: github.event_name != 'workflow_run'
        run: npm run test:position-db
      - if: github.event_name != 'workflow_run'
        run: npm run test:etf-rs
      - if: github.event_name != 'workflow_run'
        run: npm run test:universe-db
      - if: github.event_name != 'workflow_run'
        run: npm run test:temperature-db
      - if: github.event_name != 'workflow_run'
        run: npm run test:research-db
      - run: npm run build
      - if: github.event_name != 'workflow_run'
        run: npx playwright install --with-deps chromium
      - if: github.event_name != 'workflow_run'
        run: sudo apt-get install -y fonts-noto-cjk
      - if: github.event_name != 'workflow_run'
        run: npm run test:ui
      - name: Version browser assets for immediate refresh
        run: |
          python - <<'PY'
          import os, pathlib

          rev = os.environ["GITHUB_SHA"][:12]
          index = pathlib.Path("dist/index.html")
          html = index.read_text()
          html = html.replace('/peppercorn/assets/app.js"', f'/peppercorn/assets/app.js?v={rev}"')
          html = html.replace('/peppercorn/assets/app.css"', f'/peppercorn/assets/app.css?v={rev}"')
          index.write_text(html)

          sw = pathlib.Path("dist/sw.js")
          sw.write_text(sw.read_text().replace("__BUILD_REV__", rev))
          print(f"Versioned browser assets and service worker with {rev}")
          PY
      - name: Add legacy bundle aliases for cached iPad/PWA shells
        run: |
          python - <<'PY'
          import pathlib, re, shutil, subprocess

          dist = pathlib.Path("dist")
          js = dist / "assets" / "app.js"
          css = dist / "assets" / "app.css"
          if not js.exists() or not css.exists():
              raise SystemExit("stable app.js/app.css were not produced")

          aliases = set()
          commits = subprocess.check_output(
              ["git", "rev-list", "--max-count=120", "HEAD"], text=True
          ).splitlines()

          for commit in commits:
              try:
                  html = subprocess.check_output(
                      ["git", "show", f"{commit}:index.html"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue

              aliases.update(re.findall(
                  r"/peppercorn/(assets/index-[A-Za-z0-9_.-]+\.(?:js|css))",
                  html,
              ))

          for rel in sorted(aliases):
              target = dist / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(js if rel.endswith(".js") else css, target)

          print(f"Created {len(aliases)} legacy aliases:", sorted(aliases))
          PY
      - name: Publish leaderboard snapshot
        run: node scripts/publish-leaderboard.mjs
      # STOCK-FLAGS-1 + GROWTH-1/SEPA-1: display-only badges (loss, no revenue, shrinking revenue, one-day jump,
      # quarterly growth, SEPA). A failure only
      # leaves the badges out; the app works without the file.
      - name: Publish stock flags
        continue-on-error: true
        timeout-minutes: 15
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python -m pip install --quiet 'yfinance==0.2.65' 'pandas==2.3.2' 'numpy==2.3.3'
          # Keep the currently published file unless a new one is produced, so a slow or failed run never ships the app
          # without badges (2026-10-04: a stalled download hit the step timeout and the deploy lost the file).
          mkdir -p dist/data
          curl -fsS --max-time 30 https://automata49.github.io/peppercorn/data/stock-flags.json -o dist/data/stock-flags.json \
            && echo "Fallback: kept the published stock-flags.json" || echo "No published stock-flags.json to keep"
          timeout 12m python analysis/stock_flags.py --out dist/data/stock-flags.new.json
          mv dist/data/stock-flags.new.json dist/data/stock-flags.json
      - name: Keep branch Pages source deployable
        if: github.event_name != 'workflow_run'
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/sw.js sw.js
          cp dist/logo.webp logo.webp
          for f in folio-icon.webp folio-wordmark.webp folio-app-icon-180.png folio-app-icon-192.png folio-app-icon-512.png folio-app-icon-512-maskable.png; do cp "dist/$f" "$f"; done
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets manifest.webmanifest sw.js logo.webp folio-icon.webp folio-wordmark.webp folio-app-icon-180.png folio-app-icon-192.png folio-app-icon-512.png folio-app-icon-512-maskable.png .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync built Pages output [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
