name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Version browser assets for immediate refresh
        run: |
          python - <<'PY'
          import os, pathlib

          rev = os.environ["GITHUB_SHA"][:12]
          index = pathlib.Path("dist/index.html")
          html = index.read_text()
          html = html.replace('/peppercorn/assets/app.js"', f'/peppercorn/assets/app.js?v={rev}"')
          html = html.replace('/peppercorn/assets/app.css"', f'/peppercorn/assets/app.css?v={rev}"')
          index.write_text(html)

          sw = pathlib.Path("dist/sw.js")
          sw.write_text(sw.read_text().replace("__BUILD_REV__", rev))
          print(f"Versioned browser assets and service worker with {rev}")
          PY
      - name: Add legacy bundle aliases for cached iPad/PWA shells
        run: |
          python - <<'PY'
          import pathlib, re, shutil, subprocess

          dist = pathlib.Path("dist")
          js = dist / "assets" / "app.js"
          css = dist / "assets" / "app.css"
          if not js.exists() or not css.exists():
              raise SystemExit("stable app.js/app.css were not produced")

          aliases = set()
          commits = subprocess.check_output(
              ["git", "rev-list", "--max-count=120", "HEAD"], text=True
          ).splitlines()

          for commit in commits:
              try:
                  html = subprocess.check_output(
                      ["git", "show", f"{commit}:index.html"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue

              aliases.update(re.findall(
                  r"/peppercorn/(assets/index-[A-Za-z0-9_.-]+\.(?:js|css))",
                  html,
              ))

          for rel in sorted(aliases):
              target = dist / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(js if rel.endswith(".js") else css, target)

          print(f"Created {len(aliases)} legacy aliases:", sorted(aliases))
          PY
      - name: Keep branch Pages source deployable
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/sw.js sw.js
          cp dist/logo.webp logo.webp
          cp dist/apple-touch-icon.png apple-touch-icon.png
          cp dist/icon-192.png icon-192.png
          cp dist/icon-512.png icon-512.png
          cp dist/icon-512-maskable.png icon-512-maskable.png
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets manifest.webmanifest sw.js logo.webp apple-touch-icon.png icon-192.png icon-512.png icon-512-maskable.png .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync built Pages output [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
