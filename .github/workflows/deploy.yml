name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:
  # LEADERBOARD-STATIC-1: republish (build + data/leaderboard.json, no tests) after each market refresh.
  workflow_run:
    workflows: ['Refresh market analysis']
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      || (github.event_name != 'workflow_run' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'requests==2.32.5' 'pytest==8.4.2' 'pandas==2.3.2' 'numpy==2.3.3'
      - name: Verify private PDF importer fixtures
        run: |
          python -m pip install --quiet -r analysis/requirements-drive-pdf.txt
          python -m unittest analysis.test_drive_pdf_reports
          node supabase/tests/source_reports.verify.mjs
          node supabase/tests/notebook.verify.mjs
      - if: github.event_name != 'workflow_run'
        run: python -m pytest -q analysis/fundamentals
      - if: github.event_name != 'workflow_run'
        run: python -m pytest -q analysis/tests
      - if: github.event_name != 'workflow_run'
        run: python -m unittest analysis.test_leader_insights analysis.test_premium_insights
      - if: github.event_name != 'workflow_run'
        run: npm run harness:check
      - if: github.event_name != 'workflow_run'
        run: npm run test:position-db
      - if: github.event_name != 'workflow_run'
        run: npm run test:etf-rs
      - if: github.event_name != 'workflow_run'
        run: npm run test:universe-db
      - if: github.event_name != 'workflow_run'
        run: npm run test:temperature-db
      - run: npm run build
      - if: github.event_name != 'workflow_run'
        run: npx playwright install --with-deps chromium
      - if: github.event_name != 'workflow_run'
        run: sudo apt-get install -y fonts-noto-cjk
      - if: github.event_name != 'workflow_run'
        run: npm run test:four-screens
      # Full UI regression already runs in the pull-request Pepper harness.
      # Do not block publishing approved changes behind the lengthy duplicate suite.
      - name: Verify journal AI entry
        if: github.event_name != 'workflow_run'
        timeout-minutes: 3
        run: npx playwright test tests/journal-ai-entry.spec.ts
      - name: Add legacy bundle aliases for cached iPad/PWA shells
        run: |
          python - <<'PY'
          import pathlib, re, shutil, subprocess

          dist = pathlib.Path("dist")
          js = dist / "assets" / "app.js"
          css = dist / "assets" / "app.css"
          if not js.exists() or not css.exists():
              raise SystemExit("stable app.js/app.css were not produced")

          aliases = set()
          commits = subprocess.check_output(
              ["git", "rev-list", "--max-count=120", "HEAD"], text=True
          ).splitlines()

          for commit in commits:
              try:
                  html = subprocess.check_output(
                      ["git", "show", f"{commit}:index.html"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue

              aliases.update(re.findall(
                  r"/peppercorn/(assets/index-[A-Za-z0-9_.-]+\.(?:js|css))",
                  html,
              ))

          for rel in sorted(aliases):
              target = dist / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(js if rel.endswith(".js") else css, target)

          print(f"Created {len(aliases)} legacy aliases:", sorted(aliases))
          PY
      - name: Publish leaderboard snapshot
        run: node scripts/publish-leaderboard.mjs
      - name: Collect source-backed leader cards
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p dist/data
          curl -fsS --max-time 20 https://automata49.github.io/peppercorn/data/leader-insights.json -o /tmp/previous-leader-insights.json || true
          if [ -f dist/data/leaderboard.json ]; then
            python analysis/leader_insights.py --previous /tmp/previous-leader-insights.json
          else
            echo "::warning::No current leaderboard: editorial collection skipped"
          fi
      - name: Collect HS Academy public metadata
        continue-on-error: true
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m analysis.premium_insights
      # STOCK-FLAGS-1 + GROWTH-1/SEPA-1: display-only badges.
      # UI/code pushes should not wait on the slow external refresh. They reuse the currently published
      # snapshot; the market-refresh workflow is the single place that recalculates the file.
      - name: Keep published stock flags on app deploy
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        run: |
          mkdir -p dist/data
          curl -fsS --max-time 30 https://automata49.github.io/peppercorn/data/stock-flags.json -o dist/data/stock-flags.json \
            && echo "Kept the published stock-flags.json" || echo "No published stock-flags.json to keep"

      - name: Refresh stock flags after market refresh
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        timeout-minutes: 15
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python -m pip install --quiet 'yfinance==0.2.65' 'pandas==2.3.2' 'numpy==2.3.3'
          # Keep the currently published file unless a new one is produced, so a slow or failed refresh
          # never ships the app without badges.
          mkdir -p dist/data
          curl -fsS --max-time 30 https://automata49.github.io/peppercorn/data/stock-flags.json -o dist/data/stock-flags.json \
            && echo "Fallback: kept the published stock-flags.json" || echo "No published stock-flags.json to keep"
          timeout 12m python analysis/stock_flags.py --out dist/data/stock-flags.new.json
          mv dist/data/stock-flags.new.json dist/data/stock-flags.json
      - name: Keep branch Pages source deployable
        if: github.event_name != 'workflow_run'
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/sw.js sw.js
          cp dist/discovery-layout.json discovery-layout.json
          mkdir -p data
          for feed in leader-insights premium-insights; do
            if [ -f "dist/data/$feed.json" ]; then
              cp "dist/data/$feed.json" "data/$feed.json"
            else
              rm -f "data/$feed.json"
            fi
          done
          # Keep every active Folio identity asset at the branch root too. GitHub Pages can
          # publish the root sync after the Actions artifact deploy, so omitting these files
          # leaves the live shell with broken wordmark / launch / motif image URLs.
          for f in \
            folio-b-icon-180.png \
            folio-b-icon-192.png \
            folio-b-icon-512.png \
            folio-b-icon-512-maskable.png \
            folio-brand-launch.webp \
            folio-brand-launch-landscape.webp \
            folio-brand-typography.webp \
            folio-brand-photography.webp \
            folio-retro-today.webp \
            folio-retro-discover.webp \
            folio-retro-journal.webp \
            folio-retro-journey.webp \
            folio-vivid-today.webp \
            folio-vivid-discover.webp \
            folio-vivid-journal.webp \
            folio-vivid-journey.webp \
            folio-brand-wordmark-light.webp \
            folio-brand-wordmark-dark.webp \
            folio-brand-icon-black.webp \
            folio-brand-icon-glossy.webp \
            folio-brand-icon-light.webp
          do
            cp "dist/$f" "$f"
          done
          # Keep self-hosted editorial fonts available when Pages serves the
          # branch-root mirror as well as the Actions artifact.
          mkdir -p fonts
          cp -R dist/fonts/. fonts/
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets manifest.webmanifest sw.js discovery-layout.json \
            folio-b-icon-180.png folio-b-icon-192.png folio-b-icon-512.png folio-b-icon-512-maskable.png \
            public/folio-b-icon-180.png public/folio-b-icon-192.png public/folio-b-icon-512.png public/folio-b-icon-512-maskable.png \
            folio-brand-launch.webp folio-brand-launch-landscape.webp folio-brand-typography.webp folio-brand-photography.webp \
            folio-retro-today.webp folio-retro-discover.webp folio-retro-journal.webp folio-retro-journey.webp \
            folio-vivid-today.webp folio-vivid-discover.webp folio-vivid-journal.webp folio-vivid-journey.webp \
            folio-brand-wordmark-light.webp folio-brand-wordmark-dark.webp \
            folio-brand-icon-black.webp folio-brand-icon-glossy.webp folio-brand-icon-light.webp \
            .nojekyll
          git add fonts
          for feed in leader-insights premium-insights; do
            if [ -f "data/$feed.json" ] || git ls-files --error-unmatch "data/$feed.json" >/dev/null 2>&1; then
              git add -A -- "data/$feed.json"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync built Pages output [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
