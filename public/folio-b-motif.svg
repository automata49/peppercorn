<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Folio editorial cliff motif</title>
<desc id="desc">A monochrome rocky coast with a lone figure, layered mountains, technical arcs and a warm sunset disc.</desc>
<defs>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFD2BE"/>
    <stop offset=".58" stop-color="#F49A75"/>
    <stop offset="1" stop-color="#F7A24A"/>
  </linearGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E8DED4" stop-opacity=".2"/>
    <stop offset="1" stop-color="#F4F1EC" stop-opacity=".95"/>
  </linearGradient>
  <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
    <circle cx="1.8" cy="1.8" r="1.05" fill="#111113" opacity=".17"/>
  </pattern>
</defs>
<rect width="1200" height="520" fill="#F4F1EC"/>
<circle cx="945" cy="126" r="126" fill="url(#sun)" opacity=".9"/>

<!-- distant coast -->
<path d="M520 344C620 297 677 287 745 299c64 11 107-43 171-38 66 5 97 48 174 38 42-5 72 2 110 22v199H520z" fill="#D7D1CD"/>
<path d="M612 362c74-34 128-35 183-24 67 13 108-29 166-25 64 5 103 44 159 34 31-6 54-3 80 6v167H612z" fill="#BEB9B6" opacity=".72"/>
<path d="M734 390c60-28 107-23 149-13 61 14 100-20 148-15 49 5 89 31 169 19v139H734z" fill="#8F8A88" opacity=".38"/>
<rect y="382" width="1200" height="138" fill="url(#haze)"/>

<!-- technical geometry -->
<g fill="none" stroke="#111113" stroke-width="1.1" opacity=".18">
  <circle cx="667" cy="231" r="54"/>
  <circle cx="667" cy="231" r="103"/>
  <circle cx="667" cy="231" r="164"/>
  <path d="M503 231h329M667 67v328"/>
  <path d="M514 419c109-146 243-203 398-181 96 13 188 58 288 114"/>
  <path d="M590 453c131-106 267-131 401-76 70 29 135 39 209 26"/>
  <path d="M1024 38v152M1008 54h32"/>
  <circle cx="1024" cy="38" r="3" fill="#111113"/>
</g>
<rect x="748" y="284" width="172" height="92" fill="url(#dots)" opacity=".75"/>

<!-- main cliff mass -->
<path d="M0 520V358l40-15 26-41 45 7 28-63 64 18 26-80 77-18 35-57 92-19 48 31 54-63 70-17 72 42 39 66-36 39-74 22-24 55-72 21-33 47-88 2-61 34-78-7-64 29-62-2-41 29z" fill="#111113"/>
<path d="M0 431l54-19 38-49 55 11 39-55 66 11 42-51 79-15 41-37 70 13-45 54-63 23-43 52-73 20-65 40-77-8-54 30z" fill="#2A292B"/>
<path d="M22 502l62-39 74 1 50-35 85 8 74-42 89 8 47-47 93-6-55 55-82 26-75 37-105 10-73 34z" fill="#444143" opacity=".9"/>

<!-- rock facet highlights -->
<g fill="#F4F1EC" opacity=".11">
  <path d="M104 318l39-67 53 17-43 69z"/>
  <path d="M242 238l53-49 63-13-43 72z"/>
  <path d="M386 169l48-57 48 12-22 72z"/>
  <path d="M480 289l43-43 39 5-30 52z"/>
  <path d="M157 407l63-42 57 5-67 54z"/>
</g>
<g fill="none" stroke="#F4F1EC" stroke-width="1" opacity=".23">
  <path d="M34 386l94-34 61-77M114 461l111-76 88-27M228 508l75-83 109-34M360 477l86-80 103-45"/>
  <path d="M255 195l63 30 64-27M403 121l43 41 74 13M463 289l68 23 84-36"/>
</g>

<!-- lone figure -->
<g fill="#111113">
  <circle cx="671" cy="180" r="9"/>
  <path d="M661 191h20l8 59-9 74h-13l-5-74z"/>
  <path d="M662 210l-31 50 8 5 30-39zM683 210l28 49-8 5-29-39z"/>
