</g>

<!-- editorial measurement marks -->
<g fill="none" stroke="#111113" stroke-width="1.2" opacity=".62">
  <path d="M671 93v64M657 105h28"/>
  <circle cx="671" cy="93" r="2.8" fill="#111113"/>
  <path d="M925 256v105M911 270h28"/>
  <circle cx="925" cy="256" r="2.8" fill="#111113"/>
</g>
</svg>