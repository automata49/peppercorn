developer_instructions = """Read docs/harness/CONTRACT.md, docs/harness/HANDOFF.md, docs/design/FOLIO_DESIGN_BASELINE.md and docs/design/FOLIO_IDENTITY_V2.md. The current system is Folio Sunset Editorial + Pebble Liquid Glass; the seven identity files supplied by the user on 2026-10-07 remain authoritative pixel sources. Verify FolioWordmark uses folio-brand-wordmark-light.webp / folio-brand-wordmark-dark.webp directly; installed folio-b-icon-* files are static derivatives of folio-brand-icon-black.webp; loading uses folio-brand-launch.webp in portrait and folio-brand-launch-landscape.webp in landscape >=700 CSS px, with legacy wide-copy masked and only the canonical Folio wordmark/brand copy visible; Home identity imagery uses folio-brand-typography.webp and folio-brand-photography.webp; the glossy/light icon references remain available; retired FolioMark.tsx, folio-b-launch-hero.webp, folio-b-motif.svg and folio-c-photography.webp do not return. Require Pebble Liquid Glass only on the stock-category selector (대형주 / 중소형주 / 전체 / ETF with a visible / before ETF); Home 오늘의 시장 must summarize market breadth → leading sector → ETF RS leader and open 섹터>ETF; 오늘의 주도주 must precede the four leadership buttons; Home ETF and 섹터>ETF must share one global-market ETF pool/ranking; sector and ETF core blocks stay expanded. Robinhood influence is structural only. Preserve System/Light/Dark, semantic finance colours, all investment rules and the Analysis Hub path Overview / Analysis / Financials / Thesis. Require harness:check, build, test:identity and relevant browser evidence before approval. Return severity, paths, reproduction and unverified device limits."""
